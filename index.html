<style>:root {
  --bg: #f6f7fb; --panel: #ffffff; --panel-2: #f0f2f8; --text: #1b2033; --muted: #5d6680; --line: #e2e6f0;
  --brand: #4f46e5; --brand-2: #0ea5a4; --brand-soft: #eef0ff; --ok: #15803d; --ok-soft: #e8f7ee; --warn: #b45309; --warn-soft: #fff6e6;
  --bad: #b91c1c; --bad-soft: #fdecec; --shadow: 0 1px 2px rgba(20, 24, 40, .06), 0 4px 16px rgba(20, 24, 40, .06); --radius: 14px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif; --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0f1220; --panel: #171b2e; --panel-2: #1e2339; --text: #e8ebf5; --muted: #9aa3bd; --line: #2a3150;
  --brand: #8b85ff; --brand-2: #2dd4bf; --brand-soft: #23264a; --ok: #4ade80; --ok-soft: #13301f; --warn: #fbbf24; --warn-soft: #33270f;
  --bad: #f87171; --bad-soft: #3a1717; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --panel: #171b2e; --panel-2: #1e2339; --text: #e8ebf5; --muted: #9aa3bd; --line: #2a3150;
    --brand: #8b85ff; --brand-2: #2dd4bf; --brand-soft: #23264a; --ok: #4ade80; --ok-soft: #13301f; --warn: #fbbf24; --warn-soft: #33270f;
    --bad: #f87171; --bad-soft: #3a1717; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { line-height: 1.25; margin: 0 0 .5em; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 .8em; }
code, pre, .mono { font-family: var(--mono); font-size: .9em; }
pre { white-space: pre-wrap; word-break: break-word; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.spacer { height: 1rem; }

/* Layout */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 18px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; margin: 2px 6px 18px; }
.brand .logo { width: 36px; height: 36px; flex-shrink: 0; }
.brand .logo svg { width: 100%; height: 100%; display: block; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; color: var(--text); margin-bottom: 2px; font-weight: 500; }
.nav a:hover { background: var(--panel-2); text-decoration: none; }
.nav a.active { background: var(--brand-soft); color: var(--brand); }
.nav .ico { width: 22px; text-align: center; }
.main { min-width: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 24px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 5; }
.topbar .menu-btn { display: none; }
.content { padding: 24px; max-width: 1180px; margin: 0 auto; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); font-size: .85rem; white-space: nowrap; }
.chip.brand { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.xpbar { width: 120px; height: 8px; border-radius: 8px; background: var(--panel-2); overflow: hidden; }
.xpbar > div { height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand-2)); }

/* Cards & panels */
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 16px; }
.grid { display: grid; gap: 14px; }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; transition: transform .12s, box-shadow .12s, border-color .12s; box-shadow: var(--shadow); color: var(--text); }
.card:hover { transform: translateY(-2px); border-color: var(--brand); text-decoration: none; }
.card .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .icon { width: 40px; height: 40px; border-radius: 10px; background: var(--panel-2); display: grid; place-items: center; font-size: 20px; }
.card .title { font-weight: 700; font-size: 1rem; }
.card .desc { color: var(--muted); font-size: .88rem; flex: 1; }
.card .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; }
.stat { padding: 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); }
.stat .v { font-size: 1.6rem; font-weight: 800; }
.stat .l { color: var(--muted); font-size: .85rem; }

/* Forms */
label { display: block; font-weight: 600; margin: 0 0 4px; font-size: .92rem; }
.field { margin-bottom: 14px; }
.input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); outline: none; transition: border-color .12s, box-shadow .12s; }
.input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
textarea { min-height: 110px; resize: vertical; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; transition: background .12s, border-color .12s; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { filter: brightness(1.07); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: .85rem; border-radius: 8px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs button { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: .88rem; }
.tabs button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.search { position: relative; }
.search input { padding-left: 36px; }
.search::before { content: "🔎"; position: absolute; left: 11px; top: 9px; opacity: .6; }

/* Output blocks */
.output { margin-top: 18px; }
.block { margin-bottom: 14px; }
.block h3 { margin-top: 8px; }
.note { padding: 10px 14px; border-radius: 10px; background: var(--brand-soft); border-left: 4px solid var(--brand); font-size: .92rem; }
.note.warn { background: var(--warn-soft); border-color: var(--warn); }
.note.ok { background: var(--ok-soft); border-color: var(--ok); }
.tbl { width: 100%; border-collapse: collapse; font-size: .92rem; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
.tbl th, .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.tbl th { background: var(--panel-2); font-weight: 700; position: sticky; top: 0; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.pre { white-space: pre-line; font-family: var(--mono); font-size: .85rem; }
.copybox { position: relative; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px; }
.copybox .label { font-size: .78rem; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
.copybox .actions { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
.copybox pre { font-family: var(--font); font-size: .95rem; padding-right: 110px; }
.scorebox { display: flex; align-items: center; gap: 16px; padding: 14px; border-radius: 12px; background: var(--panel-2); }
.ring { --p: 50; width: 76px; height: 76px; border-radius: 50%; background: conic-gradient(var(--brand) calc(var(--p) * 1%), var(--line) 0); display: grid; place-items: center; flex-shrink: 0; }
.ring > span { width: 60px; height: 60px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; font-weight: 800; }
.quiz-q { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 10px; background: var(--panel); }
.quiz-q .opts { display: grid; gap: 6px; margin-top: 8px; }
.quiz-q .opt { text-align: left; padding: 9px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.quiz-q .opt.sel { border-color: var(--brand); background: var(--brand-soft); }
.quiz-q .opt.right { border-color: var(--ok); background: var(--ok-soft); }
.quiz-q .opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.quiz-q .exp { margin-top: 8px; font-size: .88rem; color: var(--muted); }
.flip { perspective: 900px; cursor: pointer; min-height: 150px; }
.flip .inner { position: relative; width: 100%; min-height: 150px; transition: transform .45s; transform-style: preserve-3d; }
.flip.on .inner { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); padding: 16px; display: grid; place-items: center; text-align: center; white-space: pre-wrap; overflow: auto; }
.flip .back { transform: rotateY(180deg); background: var(--brand-soft); }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 2.6rem; text-align: center; }
.steps { counter-reset: s; }
.step { display: grid; grid-template-columns: 30px 1fr; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.step .n { width: 28px; height: 28px; border-radius: 50%; background: var(--panel-2); display: grid; place-items: center; font-weight: 700; font-size: .85rem; }
.step.done .n { background: var(--ok); color: #fff; }
.mind svg { width: 100%; height: auto; background: var(--panel-2); border-radius: 12px; }
.matrix input { width: 56px; text-align: center; }
.kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; font-size: .8rem; }
.drop { border: 2px dashed var(--line); border-radius: 14px; padding: 22px; text-align: center; color: var(--muted); transition: border-color .12s, background .12s; }
.drop.over { border-color: var(--brand); background: var(--brand-soft); }
.file-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.file-row .ic { font-size: 22px; width: 32px; text-align: center; }
.attach-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.toast { position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 50; box-shadow: var(--shadow); max-width: 90vw; }
.modal-bg { position: fixed; inset: 0; background: rgba(10, 12, 25, .5); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal { background: var(--panel); border-radius: 16px; padding: 20px; width: min(640px, 100%); max-height: 88vh; overflow: auto; box-shadow: var(--shadow); }
.auth { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 20% 10%, var(--brand-soft), transparent 50%), var(--bg); }
.auth .box { width: min(420px, 100%); }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, .4); border-top-color: #fff; animation: spin .8s linear infinite; }
.spinner.dark { border-color: var(--line); border-top-color: var(--brand); }
@keyframes spin { to { transform: rotate(360deg); } }
.rsvp { font-size: 2rem; font-weight: 700; text-align: center; padding: 26px 10px; background: var(--panel-2); border-radius: 12px; min-height: 96px; }
.palette { display: flex; gap: 8px; flex-wrap: wrap; }
.palette div { width: 74px; height: 54px; border-radius: 10px; display: flex; align-items: flex-end; justify-content: center; font-size: .72rem; color: #fff; padding: 4px; text-shadow: 0 1px 2px #000; }
.order-list li { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 6px; background: var(--panel); cursor: grab; list-style: none; }
.order-list { padding: 0; }
.gantt-row { display: grid; grid-template-columns: 180px 1fr; gap: 8px; align-items: center; margin-bottom: 6px; font-size: .88rem; }
.gantt-bar { height: 18px; border-radius: 6px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
.mn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.quad > div { border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 140px; }
.quad h4 { margin: 0 0 6px; }
.hat { border-left: 6px solid; padding: 8px 12px; border-radius: 8px; background: var(--panel-2); margin-bottom: 8px; }
.empty { text-align: center; padding: 30px; color: var(--muted); }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: .75rem; background: var(--panel-2); border: 1px solid var(--line); }
.badge.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
details summary { cursor: pointer; font-weight: 600; }

@media (max-width: 980px) {
  .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; transform: translateX(-100%); transition: transform .2s; z-index: 30; }
  .sidebar.open { transform: none; box-shadow: var(--shadow); }
  .topbar .menu-btn { display: inline-flex; }
  .topbar { padding: 10px 16px; }
  .content { padding: 16px; }
  .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; }
  .copybox pre { padding-right: 0; padding-top: 30px; }
  .gantt-row { grid-template-columns: 1fr; }
  .quad { grid-template-columns: 1fr; }
  .topbar .hide-sm { display: none; }
  h1 { font-size: 1.3rem; }
}
@media print {
  .sidebar, .topbar, .no-print, .btn { display: none !important; }
  .app { display: block; }
  .panel { box-shadow: none; border: 0; }
}

/* Chat A Student AI */
.chat { display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 860px; }
.msg.user { align-self: flex-end; background: var(--brand); color: #fff; padding: 10px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
.msg.bot { align-self: flex-start; width: 100%; }
.msg.bot .panel { border-top-left-radius: 4px; }
.bot-head { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 6px; }
.bot-head .av { width: 26px; height: 26px; }
.bot-head .av svg { width: 100%; height: 100%; }
.composer { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 4px; display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { min-height: 52px; max-height: 200px; }
button.chip { cursor: pointer; font: inherit; font-size: .85rem; }
button.chip:hover { border-color: var(--brand); color: var(--brand); }
.ai-answer p { margin-bottom: 8px; }
</style>
</head>
<body>
<div id="root"><div class="auth"><div class="spinner dark"></div></div></div>
<noscript><p style="padding:24px;font-family:system-ui">Aktifkan JavaScript untuk memakai A Student.</p></noscript>
<script>
/* Penjaga: bila aplikasi gagal dimuat, tampilkan pesan yang jelas (bukan layar kosong). */
(function () {
  function show(msg) {
